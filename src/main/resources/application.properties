spring.application.name=cursos-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.cors.allowed-origin=${FRONTEND_URL:http://localhost:4200}

app.demo-data.enabled=${DEMO_DATA_ENABLED:false}
app.demo-data.admin-email=${DEMO_ADMIN_EMAIL:admin@demo.com}
app.demo-data.admin-password=${DEMO_ADMIN_PASSWORD:}

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
