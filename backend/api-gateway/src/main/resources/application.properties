spring.application.name=api-gateway
server.port=${GATEWAY_PORT:8080}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.registry-fetch-interval-seconds=5

spring.cloud.loadbalancer.eager-load.clients=auth-user-service,course-service,enrollment-service,engagement-service,admin-operations-service
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:4200}

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=never
