<section class="wide-panel"><div class="section-header"><div><span class="eyebrow">EPIC04</span><h1>Notificaciones</h1></div><button class="button secondary" (click)="readAll()">Marcar todas como leídas</button></div>@if (error()) { <p class="alert">{{ error() }}</p> }<div class="stack">@for (item of items(); track item.id) { <button class="notification" [class.unread]="!item.read" (click)="read(item)"><span><strong>{{ item.title }}</strong><small>{{ item.createdAt | date:'medium' }}</small></span><p>{{ item.message }}</p></button> } @empty { <p class="empty">No tienes notificaciones.</p> }</div></section>
