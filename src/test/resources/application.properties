spring.datasource.url=jdbc:h2:mem:cursos_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
jwt.secret=test-secret-with-more-than-thirty-two-characters-123456
jwt.expiration-ms=3600000
app.cors.allowed-origin=http://localhost:4200
app.demo-data.enabled=false
