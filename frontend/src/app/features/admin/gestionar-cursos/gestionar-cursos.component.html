<section class="wide-panel"><span class="eyebrow">EPIC05</span><h1>Gestión de cursos</h1>@if (message()) { <p class="success">{{ message() }}</p> } @if (error()) { <p class="alert">{{ error() }}</p> }
<form class="course-form" (ngSubmit)="save()"><h2>{{ editingId ? 'Editar curso' : 'Nuevo curso' }}</h2><label>Título<input name="title" [(ngModel)]="form.title" required maxlength="160"></label><label>Descripción<textarea name="description" [(ngModel)]="form.description" required maxlength="2000"></textarea></label><div class="form-grid"><label>Categoría<input name="category" [(ngModel)]="form.category" required></label><label>Nivel<select name="level" [(ngModel)]="form.level"><option>INICIAL</option><option>INTERMEDIO</option><option>AVANZADO</option></select></label><label>Precio<input name="price" [(ngModel)]="form.price" type="number" min="0" step="0.01" required></label><label>Estado<select name="status" [(ngModel)]="form.status"><option value="DRAFT">BORRADOR</option><option value="PUBLISHED">PUBLICADO</option><option value="INACTIVE">INACTIVO</option></select></label><label>Fecha inicio<input name="startDate" [(ngModel)]="form.startDate" type="date"></label><label>Fecha final<input name="endDate" [(ngModel)]="form.endDate" type="date"></label></div><label>URL de imagen<input name="imageUrl" [(ngModel)]="form.imageUrl" type="url"></label><div class="actions"><button type="submit">{{ editingId ? 'Actualizar' : 'Crear curso' }}</button>@if (editingId) { <button type="button" class="button secondary" (click)="reset()">Cancelar edición</button> }</div></form>
<div class="table-wrap"><table><thead><tr><th>Curso</th><th>Categoría</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>@for (c of courses(); track c.id) { <tr><td><strong>{{ c.title }}</strong><small>{{ c.level }}</small></td><td>{{ c.category }}</td><td><span class="status">{{ c.status }}</span></td><td><button class="mini" (click)="edit(c)">Editar</button><button class="mini danger" [disabled]="c.status === 'INACTIVE'" (click)="deactivate(c)">Desactivar</button></td></tr> }</tbody></table></div></section>
